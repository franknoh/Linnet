name: Release

# A tag v* builds the compiler, the Python wheels and the VS Code extensions
# on every platform, tests them, and publishes them: a GitHub release, then
# PyPI, the VS Code Marketplace and Open VSX.
# A pull request that changes how they are built runs the same builds and
# tests, and publishes nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - CMakeLists.txt
      - CMakePresets.json
      - python/linnet/pyproject.toml
      - python/linnet/hatch_build.py
      - python/linnet/src/linnet/compiler.py
      - scripts/build-release.sh
      - scripts/check-version.py
      - scripts/check-wheel.py
      - scripts/pack-compiler.py
      - scripts/release-notes.py
      - src/cli/main.cpp
      - editors/vscode/package.json
      - editors/vscode/.vscodeignore
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  version:
    name: Versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-version.py ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      # A release needs its section of CHANGELOG.md.
      - if: github.ref_type == 'tag'
        run: python3 scripts/release-notes.py "$GITHUB_REF_NAME"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-15 }
          - { name: windows-x86_64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      # Builds and tests the compiler, then the wheel that carries it, and
      # tests the wheel (python/linnet/pyproject.toml has the settings). The
      # archive is packed from the wheel.
      - uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: python/linnet
          output-dir: wheelhouse
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/pack-compiler.py wheelhouse/*.whl "linnet-$VERSION-${{ matrix.name }}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ matrix.name }}
          path: linnet-${{ env.VERSION }}-${{ matrix.name }}.*
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.name }}
          path: wheelhouse/*.whl

  sdist:
    name: Python source
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build --sdist --out-dir dist python/linnet
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz

  # One extension per platform carrying that platform's compiler, and one
  # without for the rest, which uses `linnet` on PATH.
  vscode:
    name: VS Code ${{ matrix.target }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, compiler: linux-x86_64 }
          - { target: linux-arm64, compiler: linux-aarch64 }
          - { target: darwin-arm64, compiler: macos-arm64 }
          - { target: win32-x64, compiler: windows-x86_64 }
          - { target: universal, compiler: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: matrix.compiler != ''
        uses: actions/download-artifact@v4
        with:
          name: compiler-${{ matrix.compiler }}
          path: compiler
      - if: matrix.compiler != ''
        run: |
          mkdir unpacked editors/vscode/server
          archive=$(ls compiler/*)
          case "$archive" in
            *.zip) unzip -q "$archive" -d unpacked ;;
            *) tar -xzf "$archive" -C unpacked ;;
          esac
          cp -R unpacked/*/. editors/vscode/server/
          ls editors/vscode/server/bin
      - run: npm ci && npm run check
        working-directory: editors/vscode
      - run: |
          if [ "${{ matrix.target }}" = universal ]; then
            npx --yes @vscode/vsce package --out "linnet-$VERSION.vsix"
          else
            npx --yes @vscode/vsce package --target "${{ matrix.target }}" --out "linnet-$VERSION-${{ matrix.target }}.vsix"
          fi
        working-directory: editors/vscode
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-${{ matrix.target }}
          path: editors/vscode/linnet-*.vsix

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [build, sdist, vscode]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/release-notes.py "$GITHUB_REF_NAME" > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # The changelog's section, then GitHub's list of the pull requests.
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: notes.md
          generate_release_notes: true

  pypi:
    name: PyPI
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    # Trusted publishing: PyPI accepts this workflow in this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/linnet-lang/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The extensions: the VS Code Marketplace and Open VSX (VSCodium, Cursor),
  # each with a token in its environment.
  vscode-marketplace:
    name: VS Code Marketplace
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    environment: vscode-marketplace
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vscode-*
          path: vsix
          merge-multiple: true
      - run: npx --yes @vscode/vsce publish --packagePath vsix/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  open-vsx:
    name: Open VSX
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    environment: open-vsx
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vscode-*
          path: vsix
          merge-multiple: true
      - run: for vsix in vsix/*.vsix; do npx --yes ovsx publish "$vsix"; done
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
