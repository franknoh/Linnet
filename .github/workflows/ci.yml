name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-13, clang++-20]
        preset: [debug, release]
        include:
          - compiler: clang++-20
            preset: sanitize
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      # Clang needs version 19 or newer to use libstdc++'s <expected>.
      - if: startsWith(matrix.compiler, 'clang')
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      - name: Repository sources are formatter-clean
        run: |
          build/${{ matrix.preset }}/linnet fmt --check examples spec-tests/valid spec-tests/fixtures stdlib
          build/${{ matrix.preset }}/linnet lint --std stdlib examples stdlib

  lint:
    name: Format and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-format-20 clang-tidy-20
      - run: scripts/check-grammar.py
      - run: scripts/check-format.sh
        env:
          CLANG_FORMAT: clang-format-20
      - run: >
          cmake --preset tidy
          -DCMAKE_CXX_COMPILER=clang++-20
          "-DCMAKE_CXX_CLANG_TIDY=clang-tidy-20;--warnings-as-errors=*"
      - run: cmake --build --preset tidy

  fuzz-smoke:
    name: Fuzz smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y libclang-rt-20-dev
      - run: cmake --preset fuzz -DCMAKE_CXX_COMPILER=clang++-20
      - run: cmake --build --preset fuzz
      - run: |
          mkdir corpus
          cp spec-tests/valid/*.linnet spec-tests/invalid/*.linnet examples/*/*.linnet corpus/
          build/fuzz/fuzz/fuzz_frontend -max_total_time=120 -max_len=2048 -timeout=10 \
            -dict=fuzz/linnet.dict corpus

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run check
        working-directory: editors/vscode

  python:
    name: Python adapters
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset release && cmake --build --preset release
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
        working-directory: python/linnet_torch
      - run: uv run ruff check src tests && uv run ruff format --check src tests
        working-directory: python/linnet_torch
      - run: uv run pyright
        working-directory: python/linnet_torch
      - run: uv run pytest -q
        working-directory: python/linnet_torch
        env:
          LINNET_BIN: ${{ github.workspace }}/build/release/linnet
      - run: uv sync --all-extras
        working-directory: python/linnet_jax
      - run: uv run ruff check src tests && uv run ruff format --check src tests
        working-directory: python/linnet_jax
      - run: uv run pyright
        working-directory: python/linnet_jax
      - run: uv run pytest -q
        working-directory: python/linnet_jax
        env:
          LINNET_BIN: ${{ github.workspace }}/build/release/linnet
      - run: uv sync --all-extras
        working-directory: python/linnet_onnx
      - run: uv run ruff check src tests && uv run ruff format --check src tests
        working-directory: python/linnet_onnx
      - run: uv run pyright
        working-directory: python/linnet_onnx
      - run: uv run pytest -q
        working-directory: python/linnet_onnx
        env:
          LINNET_BIN: ${{ github.workspace }}/build/release/linnet

  windows:
    name: Windows MSVC
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset msvc
      - run: cmake --build --preset msvc
      - run: ctest --preset msvc

  macos:
    name: macOS Clang
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: ctest --preset debug

  site:
    name: Docs site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm build
        working-directory: site
