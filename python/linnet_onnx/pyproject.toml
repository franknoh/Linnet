[project]
name = "linnet-onnx"
version = "0.1.0"
description = "Import ONNX graphs as Linnet source"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "onnx>=1.16",
    "numpy>=1.26",
    "safetensors>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linnet_onnx"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.380",
    "ruff>=0.6",
    "torch>=2.4",
    "onnxscript>=0.3",
    "linnet-torch",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
linnet-torch = { path = "../linnet_torch", editable = true }

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = false
# onnx ships without type information for its protobuf classes.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportPrivateImportUsage = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
