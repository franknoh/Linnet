[project]
name = "linnet-torch"
version = "0.1.0"
description = "Materialize Linnet models as PyTorch modules"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "safetensors>=0.4",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyright>=1.1.380",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linnet_torch"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.380",
    "ruff>=0.6",
    "jax>=0.4.35",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pyright]
include = ["src", "tests"]
strict = ["src", "tests"]
pythonVersion = "3.11"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
