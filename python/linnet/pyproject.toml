"src/linnet/torch/export.py" = ["ANN401"]
"src/linnet/torch/fsdp.py" = ["ANN401"]
"src/linnet/torch/function.py" = ["ANN401"]
"src/linnet/torch/interp.py" = ["ANN401"]
"src/linnet/torch/loss.py" = ["ANN401"]
"src/linnet/torch/module.py" = ["ANN401"]
"src/linnet/torch/paged.py" = ["ANN401"]
