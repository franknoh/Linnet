[project]
name = "linnet-lang"
version = "0.1.0"
description = "Load, run, export, and draw Linnet models in PyTorch, JAX, and ONNX"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suho Noh" }]
keywords = ["tensor", "compiler", "pytorch", "jax", "onnx", "deep learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "numpy>=1.26",
    "safetensors>=0.4",
]

[project.urls]
Homepage = "https://linnet.franknoh.dev"
Documentation = "https://linnet.franknoh.dev/docs/python"
Repository = "https://github.com/franknoh/Linnet"
Issues = "https://github.com/franknoh/Linnet/issues"
Models = "https://nest.franknoh.dev"

[project.optional-dependencies]
torch = ["torch>=2.4"]
jax = ["jax>=0.4.35"]
flax = ["jax>=0.4.35", "flax>=0.12"]
onnx = ["onnx>=1.16"]
nest = ["huggingface-hub>=0.24"]
serve = ["torch>=2.4", "huggingface-hub>=0.24", "transformers>=4.45"]
all = [
    "torch>=2.4",
    "jax>=0.4.35",
    "flax>=0.12",
    "onnx>=1.16",
    "huggingface-hub>=0.24",
    "transformers>=4.45",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linnet"]

# LINNET_PREFIX puts a built compiler into the wheel (hatch_build.py).
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist]
include = ["src/linnet", "hatch_build.py", "README.md", "LICENSE"]

# The wheel carries the compiler, not an extension module, so one build per
# platform serves every Python version. Each platform builds and tests the
# compiler first (scripts/build-release.sh) and installs it into
# build/wheel-prefix at the repository's root.
[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_*"
archs = ["native"]
environment = { LINNET_PREFIX = "../../build/wheel-prefix" }
test-command = "python {project}/scripts/check-wheel.py {project}"

[tool.cibuildwheel.linux]
before-all = "pipx install cmake && pipx install ninja && bash scripts/build-release.sh build/wheel-prefix"

[tool.cibuildwheel.macos]
environment = { LINNET_PREFIX = "../../build/wheel-prefix", MACOSX_DEPLOYMENT_TARGET = "14.0" }
before-all = "brew install ninja && bash scripts/build-release.sh build/wheel-prefix"

[tool.cibuildwheel.windows]
# The C++ runtime is linked in, since Windows does not always have it, and
# the wheel has no DLLs for delvewheel to bundle.
repair-wheel-command = ""
before-all = [
    "cmake --preset msvc -DLINNET_WARNINGS_AS_ERRORS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded",
    "cmake --build --preset msvc --config Release",
    "ctest --preset msvc -C Release",
    "cmake --install build/msvc --config Release --prefix build/wheel-prefix",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.380",
    "ruff>=0.6",
    "torch>=2.4",
    # The released flax needs an unreleased jax; the last pair that works.
    "jax<0.11",
    "flax>=0.12,<0.12.7",
    "onnx>=1.16",
    "onnxscript>=0.3",
    "onnxruntime>=1.18",
    "transformers>=5.17.0",
    "huggingface-hub>=1.32.0",
    "trl>=1.14",
    "accelerate>=1.10",
    "optax>=0.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pyright]
include = ["src", "tests"]
strict = ["src", "tests"]
pythonVersion = "3.11"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "ANN401"]

# `Any` in a signature is banned. These files still have some: shrink the
# list as they are typed, never add to it.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN401"]
"src/linnet/convert.py" = ["ANN401"]
"src/linnet/ir.py" = ["ANN401"]
"src/linnet/jax/dpo.py" = ["ANN401"]
"src/linnet/jax/export.py" = ["ANN401"]
"src/linnet/jax/flax_nnx.py" = ["ANN401"]
