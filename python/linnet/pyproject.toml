"src/linnet/onnx/runtime.py" = ["ANN401"]
"src/linnet/resources/calibrate.py" = ["ANN401"]
"src/linnet/serve/__init__.py" = ["ANN401"]
"src/linnet/serve/sampling.py" = ["ANN401"]
"src/linnet/serve/server.py" = ["ANN401"]
