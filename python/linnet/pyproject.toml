[project]
name = "linnet-lang"
version = "0.1.0"
description = "Load, run, export, and draw Linnet models in PyTorch, JAX, and ONNX"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "safetensors>=0.4",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
jax = ["jax>=0.4.35"]
flax = ["jax>=0.4.35", "flax>=0.12"]
onnx = ["onnx>=1.16"]
nest = ["huggingface-hub>=0.24"]
all = ["torch>=2.4", "jax>=0.4.35", "flax>=0.12", "onnx>=1.16", "huggingface-hub>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linnet"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.380",
    "ruff>=0.6",
    "torch>=2.4",
    # The released flax needs an unreleased jax; the last pair that works.
    "jax<0.11",
    "flax>=0.12,<0.12.7",
    "onnx>=1.16",
    "onnxscript>=0.3",
    "onnxruntime>=1.18",
    "transformers>=5.17.0",
    "huggingface-hub>=1.32.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pyright]
include = ["src", "tests"]
strict = ["src", "tests"]
pythonVersion = "3.11"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
